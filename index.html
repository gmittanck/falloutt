<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RPG Prototype</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background: #222; border: 2px solid #555; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Protótipo de RPG 2D</h2>
    <p>Use as teclas W, A, S, D ou as setas do teclado para mover o personagem.</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = { x: 300, y: 200, size: 20, color: "gold", speed: 4 };
        let keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function update() {
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.y -= player.speed;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.y += player.speed;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed;
            
            // Limites da tela
            if (player.x < 10) player.x = 10;
            if (player.x > canvas.width - 10) player.x = canvas.width - 10;
            if (player.y < 10) player.y = 10;
            if (player.y > canvas.height - 10) player.y = canvas.height - 10;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
