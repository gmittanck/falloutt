<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superman: Resgate na Metrópolis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #0b1d3a, #1f4068);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Variáveis do Jogo
    let score = 0;
    let lives = 3;
    let gameState = "start"; // start, playing, gameover

    // Posição e tamanho do Superman
    const superman = {
        x: 175,
        y: 520,
        width: 50,
        height: 50,
        speed: 7,
        dx: 0
    };

    // Listas de itens (Cidadãos para salvar e Meteoros)
    let citizens = [];
    let kryptonite = [];

    // Controles do Teclado
    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (gameState === "start" && e.code === "Space") {
            resetGame();
            gameState = "playing";
        }
        if (gameState === "gameover" && e.code === "Space") {
            resetGame();
            gameState = "playing";
        }
    });

    window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
    });

    function resetGame() {
        score = 0;
        lives = 3;
        citizens = [];
        kryptonite = [];
        superman.x = 175;
    }

    // Criar Cidadãos e Meteoros periodicamente
    function spawnItems() {
        if (gameState !== "playing") return;

        // Cidadãos caindo
        if (Math.random() < 0.03) {
            citizens.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                size: 25,
                speed: 3 + Math.random() * 2
            });
        }

        // Kryptonita (Obstáculo)
        if (Math.random() < 0.02) {
            kryptonite.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                size: 25,
                speed: 4 + Math.random() * 2
            });
        }
    }

    function update() {
        if (gameState !== "playing") return;

        // Movimento do Superman
        if (keys["ArrowLeft"] || keys["KeyA"]) {
            superman.x -= superman.speed;
        }
        if (keys["ArrowRight"] || keys["KeyD"]) {
            superman.x += superman.speed;
        }

        // Limites da tela
        if (superman.x < 0) superman.x = 0;
        if (superman.x + superman.width > canvas.width) {
            superman.x = canvas.width - superman.width;
        }

        // Atualizar Cidadãos
        for (let i = citizens.length - 1; i >= 0; i--) {
            citizens[i].y += citizens[i].speed;

            // Colisão com o Superman (Salvar)
            if (
                superman.x < citizens[i].x + citizens[i].size &&
                superman.x + superman.width > citizens[i].x &&
                superman.y < citizens[i].y + citizens[i].size &&
                superman.y + superman.height > citizens[i].y
            ) {
                score += 10;
                citizens.splice(i, 1);
                continue;
            }

            // Se cair no chão (Perde vida)
            if (citizens[i].y > canvas.height) {
                citizens.splice(i, 1);
                lives--;
                if (lives <= 0) {
                    gameState = "gameover";
                }
            }
        }

        // Atualizar Kryptonita
        for (let i = kryptonite.length - 1; i >= 0; i--) {
            kryptonite[i].y += kryptonite[i].speed;

            // Colisão com o Superman (Dano)
            if (
                superman.x < kryptonite[i].x + kryptonite[i].size &&
                superman.x + superman.width > kryptonite[i].x &&
                superman.y < kryptonite[i].y + kryptonite[i].size &&
                superman.y + superman.height > kryptonite[i].y
            ) {
                kryptonite.splice(i, 1);
                lives--;
                if (lives <= 0) {
                    gameState = "gameover";
                }
                continue;
            }

            // Remover se passar da tela
            if (kryptonite[i].y > canvas.height) {
                kryptonite.splice(i, 1);
            }
        }
    }

    function draw() {
        // Limpar tela
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === "start") {
            ctx.fillStyle = "white";
            ctx.font = "24px Arial";
            ctx.textAlign = "center";
            ctx.fillText("SUPERMAN: RESGATE", canvas.width / 2, canvas.height / 2 - 40);
            ctx.font = "14px Arial";
            ctx.fillText("Use as setas ← → para mover", canvas.width / 2, canvas.height / 2);
            ctx.fillText("Salve os civis e desvie da Kryptonita!", canvas.width / 2, canvas.height / 2 + 30);
            ctx.fillStyle = "#00ffcc";
            ctx.fillText("Pressione ESPAÇO para Começar", canvas.width / 2, canvas.height / 2 + 80);
            return;
        }

        if (gameState === "gameover") {
            ctx.fillStyle = "red";
            ctx.font = "28px Arial";
            ctx.textAlign = "center";
            ctx.fillText("FIM DE JOGO", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = "white";
            ctx.font = "16px Arial";
            ctx.fillText("Pontuação Final: " + score, canvas.width / 2, canvas.height / 2 + 10);
            ctx.fillText("Pressione ESPAÇO para Reiniciar", canvas.width / 2, canvas.height / 2 + 50);
            return;
        }

        // Desenhar Superman (Representado por um bloco estilizado azul e vermelho)
        ctx.fillStyle = "#0044cc"; // Roupa Azul
        ctx.fillRect(superman.x, superman.y, superman.width, superman.height);
        ctx.fillStyle = "#ffcc00"; // Detalhe amarelo (Cinto)
        ctx.fillRect(superman.x + 10, superman.y + 30, 30, 5);
        ctx.fillStyle = "#ff0000"; // Capa vermelha
        ctx.fillRect(superman.x + 15, superman.y - 10, 20, 15);

        // Desenhar Cidadãos (Círculos Azuis Claros)
        ctx.fillStyle = "#00ffcc";
        for (let c of citizens) {
            ctx.beginPath();
            ctx.arc(c.x + c.size/2, c.y + c.size/2, c.size/2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Desenhar Kryptonita (Círculos Verdes)
        ctx.fillStyle = "#00ff00";
        for (let k of kryptonite) {
            ctx.beginPath();
            ctx.arc(k.x + k.size/2, k.y + k.size/2, k.size/2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Placar e Vidas
        ctx.fillStyle = "white";
        ctx.font = "16px Arial";
        ctx.textAlign = "left";
        ctx.fillText("Pontos: " + score, 20, 30);
        ctx.fillText("Vidas: " + lives, 20, 55);
    }

    function loop() {
        spawnItems();
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
